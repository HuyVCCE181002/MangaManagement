name: Build & Deploy Beta

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Deploy Beta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tests before build
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK file for deployment
        id: prepare_apk
        run: |
          APK_ORIGINAL="build/app/outputs/flutter-apk/app-release.apk"
          APK_TARGET_NAME="MangaManagement-Beta-build${{ github.run_number }}.apk"
          APK_TARGET_PATH="build/app/outputs/flutter-apk/${APK_TARGET_NAME}"
          
          if [ -f "$APK_ORIGINAL" ]; then
            cp "$APK_ORIGINAL" "$APK_TARGET_PATH"
            echo "apk_name=${APK_TARGET_NAME}" >> $GITHUB_OUTPUT
            echo "apk_path=${APK_TARGET_PATH}" >> $GITHUB_OUTPUT
            echo "✅ Đã chuẩn bị file APK: ${APK_TARGET_NAME}"
          else
            echo "❌ Không tìm thấy file APK tại ${APK_ORIGINAL}"
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 14

      - name: Deploy Beta Release to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-beta.${{ github.run_number }}"
          name: "Manga Management App - Beta Build ${{ github.run_number }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
